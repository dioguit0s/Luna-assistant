services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: luna-homeassistant
    restart: unless-stopped
    # host: necessário para descoberta dos dispositivos ESPHome via mDNS.
    # Em host mode as portas não são publicadas — o HA escuta direto na 8123 do servidor.
    network_mode: host
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Sao_Paulo
    # Adaptadores USB (Zigbee/Z-Wave) exigem `privileged: true` e o mount de
    # /run/dbus. Os satélites do Épico 3 falam ESPHome sobre Wi-Fi, então nada
    # disso é necessário — reintroduzir apenas se entrar hardware USB no servidor.

  # Redis — previsto apenas no Épico 4 (persistência de contexto entre restarts).
  # Manter comentado até lá.
