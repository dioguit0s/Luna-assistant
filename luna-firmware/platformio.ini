; Luna — Firmware do Satélite de Borda
; Placa: ESP32-S3 N16R8 (16MB flash QIO + 8MB PSRAM Octal)

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; USB Serial/JTAG nativo (HWCDC): não alternar DTR/RTS ao abrir o monitor,
; evita reset/travamento do CDC e mantém o log estável.
monitor_dtr = 0
monitor_rts = 0

; N16R8: flash QIO + PSRAM Octal (OPI). Sem isto a PSRAM não é detectada.
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -I src
  ; Serial -> USB Serial/JTAG nativo (COM6, VID:PID 303A:1001).
  ; Sem isto, Serial.print vai para a UART0 e os logs somem no monitor.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  links2004/WebSockets @ ^2.4.2
  bblanchon/ArduinoJson @ ^7
